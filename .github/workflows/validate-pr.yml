name: Validate PR Metadata

on:
  pull_request:
    paths:
      - '**/*.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.result.outputs.passed }}
      trusted: ${{ steps.result.outputs.trusted }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed JSON files
        id: changed
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.json' | paste -sd ' ')
          echo "files=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed JSON files: $CHANGED"

      - name: Validate each changed file
        run: |
          FILES="${{ steps.changed.outputs.files }}"
          if [ -z "$FILES" ]; then
            echo "No JSON files changed — skipping validation"
            exit 0
          fi

          for file in $FILES; do
            if [ ! -f "$file" ]; then continue; fi

            echo "Checking: $file"

            # JSON syntax
            if ! jq empty "$file" 2>/dev/null; then
              echo "❌ $file: invalid JSON"
              exit 1
            fi

            # Determine if this is a source metadata file (other-sources/{name}.json)
            # vs a document file (other-sources/{name}/{file}.json or jammu-university/...)
            TOP="${file%%/*}"
            if [ "$TOP" = "other-sources" ]; then
              # Count path segments: "other-sources/foo.json" → 2 (metadata), "other-sources/foo/bar.json" → 3 (doc)
              SEG_COUNT=$(echo "$file" | tr '/' '\n' | grep -c .)
              if [ "$SEG_COUNT" -eq 2 ]; then
                IS_META=true
              else
                IS_META=false
              fi
            else
              IS_META=false
            fi

            if [ "$IS_META" = true ]; then
              # Validate as source metadata: an object with name, description, url
              TYPE=$(jq -r 'type' "$file" 2>/dev/null)
              if [ "$TYPE" != "object" ]; then
                echo "❌ $file: source metadata must be a JSON object, got $TYPE"
                exit 1
              fi
              NAME=$(jq -r '.name // empty' "$file")
              DESC=$(jq -r '.description // empty' "$file")
              URL=$(jq -r '.url // empty' "$file")
              if [ -z "$NAME" ]; then
                echo "❌ $file: source metadata missing 'name'"
                exit 1
              fi
              if [ -z "$URL" ]; then
                echo "❌ $file: source metadata missing 'url'"
                exit 1
              fi
              case "$URL" in
                https://*) ;;
                *) echo "❌ $file: source metadata 'url' must start with https"; exit 1 ;;
              esac
              echo "  Source: ${NAME} (metadata)"
              echo "✅ $file: valid source metadata"
            else
              # Validate as an array of documents
              TYPE=$(jq -r 'type' "$file" 2>/dev/null)
              if [ "$TYPE" != "array" ]; then
                echo "❌ $file: must be a JSON array, got $TYPE"
                exit 1
              fi

              COUNT=$(jq 'length' "$file")
              if [ "$COUNT" -eq 0 ]; then
                echo "❌ $file: empty array"
                exit 1
              fi

              # Each document must have title, url, type
              for i in $(seq 0 $((COUNT - 1))); do
                TITLE=$(jq -r ".[$i].title // empty" "$file")
                URL=$(jq -r ".[$i].url // empty" "$file")
                TYPE=$(jq -r ".[$i].type // empty" "$file")
                if [ -z "$TITLE" ] || [ -z "$URL" ] || [ -z "$TYPE" ]; then
                  echo "❌ $file doc $((i+1)): missing title, url, or type"
                  exit 1
                fi
                case "$URL" in
                  https://*) ;;
                  *) echo "❌ $file doc $((i+1)): url must start with https"; exit 1 ;;
                esac
                # Validate thumbnailUrl if present
                THUMB=$(jq -r ".[$i].thumbnailUrl // empty" "$file")
                if [ -n "$THUMB" ]; then
                  case "$THUMB" in
                    https://*) ;;
                    *) echo "❌ $file doc $((i+1)): thumbnailUrl must start with https if provided"; exit 1 ;;
                  esac
                fi
              done

              if [ "$TOP" = "other-sources" ]; then
                SOURCE="$(echo "$file" | cut -d'/' -f2)"
                echo "  Source: $SOURCE (in other-sources/)"
              elif [ "$TOP" = "jammu-university" ]; then
                echo "  Source: jammu-university"
              else
                echo "  Source: $TOP (non-standard)"
              fi
              echo "✅ $file: $COUNT valid document(s)"
            fi
          done
          echo "All checks passed"

      # ── Check contributor trust via TRUSTED_CONTRIBUTORS variable ──
      - name: Check contributor trust
        id: trust
        env:
          TRUSTED: ${{ vars.TRUSTED_CONTRIBUTORS }}
        run: |
          FILES="${{ steps.changed.outputs.files }}"
          if [ -z "$FILES" ] || [ -z "$TRUSTED" ]; then
            echo "trusted=false" >> $GITHUB_OUTPUT
            echo "No files changed or TRUSTED_CONTRIBUTORS not set — not auto-merging"
            exit 0
          fi

          TRUSTED_LIST=$(echo "$TRUSTED" | tr ',' '\n' | xargs)
          echo "Trusted list set to: $(echo "$TRUSTED_LIST" | tr '\n' ' ')"
          FOUND=false

          for file in $FILES; do
            [ ! -f "$file" ] && continue

            # Skip source metadata files
            TOP="${file%%/*}"
            if [ "$TOP" = "other-sources" ]; then
              SEG_COUNT=$(echo "$file" | tr '/' '\n' | grep -c .)
              [ "$SEG_COUNT" -eq 2 ] && continue
            fi

            # Extract contributor fields
            CONTRIBUTORS=$(jq -r '.[].contributor // empty' "$file" 2>/dev/null)
            for c in $CONTRIBUTORS; do
              for trusted in $TRUSTED_LIST; do
                if [ "$c" = "$trusted" ]; then
                  echo "✅ Trusted contributor: $c"
                  FOUND=true
                fi
              done
            done
          done

          if [ "$FOUND" = true ]; then
            echo "trusted=true" >> $GITHUB_OUTPUT
          else
            echo "trusted=false" >> $GITHUB_OUTPUT
            echo "No contributor in trusted list — PR needs manual review"
          fi

      - name: Set result
        id: result
        run: |
          echo "passed=true" >> $GITHUB_OUTPUT
          echo "trusted=${{ steps.trust.outputs.trusted }}" >> $GITHUB_OUTPUT

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const passed = '${{ steps.result.outputs.passed }}' === 'true';
            const trusted = '${{ steps.trust.outputs.trusted }}' === 'true';
            let body = '## 📋 PR Validation Results\\n\\n';
            if (!passed) {
              body += '❌ **Validation failed.** Please fix the errors above.';
            } else if (trusted) {
              body += '✅ **All checks passed.** Auto-merge will proceed.';
            } else {
              body += '✅ **Validation passed.** PR needs manual review (new contributor).';
              body += '\\n\\nA maintainer will verify the links and merge shortly.';
            }
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('PR Validation Results'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: body,
              });
            }

  auto-merge:
    needs: validate
    if: needs.validate.outputs.passed == 'true' && needs.validate.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge PR
        id: merge
        uses: actions/github-script@v7
        with:
          script: |
            try {
              // Get PR details first (to capture head branch BEFORE merging)
              const { data: prData } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              const headBranch = prData.head.ref;

              // Attempt squash merge
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                merge_method: "squash",
              });

              // Signal success and pass branch name
              core.setOutput('merged', 'true');
              core.exportVariable('HEAD_BRANCH', headBranch);
            } catch (err) {
              core.setOutput('merged', 'false');
              console.log('Merge failed (branch protection or conflict):', err.message);
            }

      - name: Delete merged branch
        if: steps.merge.outputs.merged == 'true'
        run: |
          BRANCH="$HEAD_BRANCH"
          if [ -n "$BRANCH" ] && [ "$BRANCH" != "main" ]; then
            curl -s -L -X DELETE "https://api.github.com/repos/${{ github.repository }}/git/refs/heads/$BRANCH" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
            echo "Deleted branch: $BRANCH"
          fi

      - name: Trigger website redeploy
        if: steps.merge.outputs.merged == 'true'
        run: |
          HOOK_URL="${{ secrets.VERCEL_DEPLOY_HOOK }}"
          if [ -n "$HOOK_URL" ]; then
            curl -s -L -X POST "$HOOK_URL"
            echo "Website redeploy triggered."
          else
            echo "VERCEL_DEPLOY_HOOK not set — skipping website redeploy."
            echo "To enable: Add the deploy hook URL as a repository secret named VERCEL_DEPLOY_HOOK."
            echo "Create one at: Vercel Dashboard → (your project) → Settings → Git → Deploy Hooks"
          fi
