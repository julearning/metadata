name: Validate PR Metadata

on:
  pull_request:
    paths:
      - '**/*.json'
      - '.github/workflows/*'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.result.outputs.passed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JSON syntax
        id: syntax
        run: |
          find . -name "*.json" -not -path "./.git/*" | while read file; do
            if ! jq empty "$file" 2>/dev/null; then
              echo "❌ Invalid JSON: $file"
              exit 1
            fi
          done
          echo "✅ All JSON files valid"

      - name: Validate document structure
        id: structure
        run: |
          find . -name "*.json" -not -path "./.git/*" -not -path "./.github/*" | while read file; do
            COUNT=$(jq length "$file" 2>/dev/null)
            if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ]; then
              echo "❌ $file: empty document array"
              exit 1
            fi
            for i in $(seq 0 $((COUNT - 1))); do
              TITLE=$(jq -r ".[$i].title // empty" "$file")
              URL=$(jq -r ".[$i].url // empty" "$file")
              TYPE=$(jq -r ".[$i].type // empty" "$file")
              if [ -z "$TITLE" ] || [ -z "$URL" ] || [ -z "$TYPE" ]; then
                echo "❌ $file doc $((i+1)): missing title, url, or type"
                exit 1
              fi
              case "$URL" in https://*) ;; *) echo "❌ $file: url must be https"; exit 1 ;; esac
            done
            echo "✅ $file: $COUNT document(s)"
          done

      - name: Set result
        id: result
        run: echo "passed=true" >> $GITHUB_OUTPUT

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.result.outputs.passed }}' === 'true';
            let body = '## 📋 PR Validation Results\\n\\n';
            body += passed
              ? '✅ **All checks passed.** This PR is valid.'
              : '❌ **Validation failed.** Please fix the errors above.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

  auto-merge:
    needs: validate
    if: needs.validate.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge PR
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                merge_method: "squash",
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '🚀 **Auto-merged successfully!**',
              });
            } catch (err) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '⚠️ Validation passed but auto-merge failed. A maintainer needs to merge manually.',
              });
            }
