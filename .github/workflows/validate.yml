name: Validate Metadata

on:
  pull_request:
    paths:
      - '**.json'
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON syntax
        run: |
          echo "Checking JSON syntax..."
          find . -name "*.json" -not -path "./.git/*" -not -path "./.github/*" | while read file; do
            if ! jq empty "$file" 2>/dev/null; then
              echo "❌ Invalid JSON: $file"
              exit 1
            fi
            echo "✅ Valid JSON: $file"
          done

      - name: Validate document arrays
        run: |
          echo "Checking document array structure..."
          find . -name "*.json" -not -path "./.git/*" -not -path "./.github/*" | while read file; do
            COUNT=$(jq length "$file" 2>/dev/null)
            if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ]; then
              echo "❌ $file: empty or invalid document array"
              exit 1
            fi
            for i in $(seq 0 $((COUNT - 1))); do
              TITLE=$(jq -r ".[$i].title // empty" "$file")
              URL=$(jq -r ".[$i].url // empty" "$file")
              TYPE=$(jq -r ".[$i].type // empty" "$file")
              if [ -z "$TITLE" ] || [ -z "$URL" ] || [ -z "$TYPE" ]; then
                echo "❌ $file document $((i+1)): missing required field (title, url, or type)"
                exit 1
              fi
              case "$URL" in
                https://*) ;;
                *) echo "❌ $file document $((i+1)): url must start with https"; exit 1 ;;
              esac
            done
            echo "✅ $file: $COUNT valid document(s)"
          done

      - name: Check for duplicate titles
        run: |
          echo "Checking for duplicate titles within each file..."
          find . -name "*.json" -not -path "./.git/*" -not -path "./.github/*" | while read file; do
            DUPS=$(jq -r '.[].title' "$file" 2>/dev/null | sort | uniq -d)
            if [ -n "$DUPS" ]; then
              echo "❌ $file has duplicate titles:"
              echo "$DUPS"
              exit 1
            fi
          done
          echo "✅ No duplicate titles found"
